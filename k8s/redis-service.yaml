# ------------------ Kubernetes Redis Service Definition -----------------------
# Exposes market-redis container on internal DNS hostname 'market-redis' port 6379.
# --------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: market-redis
  namespace: market-service
  labels:
    app: market-service
    component: redis-service
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: market-service
    component: redis
