# ------------------ Kubernetes Celery Worker Deployment -----------------------
# Deployment manifest for asynchronous Celery background worker pods.
# Workers consume price alert evaluations and background market updates.
# --------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-celery-worker
  namespace: market-service
  labels:
    app: market-service
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-service
      component: celery-worker
  template:
    metadata:
      labels:
        app: market-service
        component: celery-worker
    spec:
      containers:
        # ------------------ Celery Worker Process -----------------------
        - name: celery-worker
          image: market-service:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "market_service.core.celery", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: market-service-config
            - secretRef:
                name: market-service-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
