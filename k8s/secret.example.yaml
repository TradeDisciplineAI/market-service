# ------------------ Kubernetes Secret Template (Example) -----------------------
# Secrets store sensitive data like database passwords, Redis URLs, and API keys.
# DO NOT commit real production passwords to git repositories!
# Copy this template to 'secret.yaml' before running 'kubectl apply'.
# --------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: market-service-secret
  namespace: market-service
  labels:
    app: market-service
    component: secret
type: Opaque
stringData:
  # ------------------ PostgreSQL Database Connection String -----------------------
  # Format: postgresql+asyncpg://<username>:<password>@<host>:<port>/<dbname>
  DATABASE_URL: "postgresql+asyncpg://user:password@shared_test_db:5432/trading_db"

  # ------------------ Redis & Celery Task Queue URLs -----------------------
  REDIS_URL: "redis://market-redis:6379/0"
  CELERY_BROKER_URL: "redis://market-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://market-redis:6379/0"

  # ------------------ Internal API Authentication Secret -----------------------
  # Used for securing communication between AI-Service and market-service
  INTERNAL_API_SECRET: "your-internal-api-secret-key-change-in-prod"
