# =============================================================================
# Market Service — Docker Compose Specification
#
# Services:
#   - app: FastAPI Web Application
#   - celery_worker: Background Task Worker
#   - celery_beat: Background Scheduler
#
# Infrastructure:
#   Connects to shared PostgreSQL ('shared_db') and shared Redis ('shared_redis')
#   via external network 'trading_network'.
# =============================================================================

services:
  market_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: market_app

    ports:
      - "8001:8000"
    command: ["uvicorn", "market_service.main:app", "--host", "0.0.0.0", "--port", "8000"]

    environment:
      - APP_NAME=Market Service
      - APP_VERSION=0.1.0
      - APP_ENV=development
      - DEBUG=true

      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256

      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://shared_redis:6379/0

      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:5173","http://localhost:5175"]
      - ALLOWED_HOSTS=["localhost","127.0.0.1","host.docker.internal","market_app","*"]


    networks:
      - trading_network

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: always

  market_celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery

    command: ["celery", "-A", "market_service.core.celery.celery_app", "worker", "-Q", "market_queue", "--loglevel=info"]

    environment:
      - REDIS_URL=redis://shared_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

    networks:
      - trading_network

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: always

  market_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery_beat

    command: >
      celery -A market_service.core.celery.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule.db

    environment:
      - REDIS_URL=redis://shared_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

    networks:
      - trading_network

    restart: always

networks:
  trading_network:
    external: true
