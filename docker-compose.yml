services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_app

    ports:
      - "8001:8000"

    environment:
      - APP_NAME=Market Service
      - APP_VERSION=0.1.0
      - APP_ENV=development
      - DEBUG=true

      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256

      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/market_db

      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

      - REDIS_URL=redis://redis:6379/0

      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:5173","http://localhost:5175"]

    depends_on:
      db:
        condition: service_healthy

    restart: always

  redis:
    image: redis:7-alpine
    container_name: market_redis

    ports:
      - "6381:6379"

    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery

    command: >
      celery -A market_service.core.celery.celery_app worker --loglevel=info

    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/market_db
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

    depends_on:
      - redis
      - db

    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery_beat

    command: >
      celery -A market_service.core.celery.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule.db

    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/market_db
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}

    depends_on:
      - redis
      - db

    restart: always

  db:
    image: postgres:16-alpine
    container_name: market_db

    ports:
      - "5434:5432"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=market_db

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d market_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

volumes:
  pgdata:
